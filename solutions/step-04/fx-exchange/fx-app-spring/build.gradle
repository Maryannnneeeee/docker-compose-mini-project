plugins {
    id 'java'
    id 'org.springframework.boot'        version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group       = 'com.fx'
version     = '0.1.0-SNAPSHOT'
description = 'Currency exchange API'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly    'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// The `java` plugin's jar task emits an extra `-plain.jar` alongside bootJar. Disable it so
// the executable bootJar is the only thing in build/libs — a glob there stays unambiguous.
tasks.named('jar') { enabled = false }

// Gradle prints nothing per test, so a run that passed and a run that was skipped look the same
// on the console. Print the counts — a silently skipped integration test is exactly the trap this
// project warns about, and you cannot spot it in a build that only says BUILD SUCCESSFUL.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    afterSuite { desc, result ->
        if (!desc.parent) {
            println "${name}: ${result.testCount} tests, ${result.successfulTestCount} passed, " +
                    "${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
        }
    }
}
