name: CI
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: fx-exchange/fx-app-spring   # where the build lives, not the repo root
      - name: Build and test
        run: ./gradlew build
        working-directory: fx-exchange/fx-app-spring

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [fx-app-spring, fx-monitor]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ${{ matrix.app }}:ci .
        working-directory: fx-exchange/${{ matrix.app }}
