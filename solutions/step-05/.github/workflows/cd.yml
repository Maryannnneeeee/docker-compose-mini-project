name: CD
on:
  push:
    branches: [main]

# GITHUB_TOKEN is read-only for contents by default; publishing a package needs this.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: fx-exchange/fx-app-spring
      - name: Build and test
        run: ./gradlew build
        working-directory: fx-exchange/fx-app-spring

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [fx-app-spring, fx-monitor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        working-directory: fx-exchange/${{ matrix.app }}
        run: |
          # GHCR rejects an owner segment containing uppercase characters with
          # "400 invalid reference format", so lowercase it rather than trusting the org name.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/${{ matrix.app }}"
          SHORT="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:sha-$SHORT" -t "$IMAGE:latest" .
          docker push "$IMAGE:sha-$SHORT"
          docker push "$IMAGE:latest"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for app in fx-app-spring fx-monitor; do
            echo "Would pull ghcr.io/$OWNER/$app:latest on the staging host"
          done
